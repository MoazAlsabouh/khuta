<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول • خريطة الدراسة</title><link rel="stylesheet" href="login.css">
  <style>
    .links { display: flex; justify-content: space-between; margin-top: 15px; font-size: 0.9em; }
    .links a { color: #4CAF50; text-decoration: none; }
  </style>
</head>
<body>
  <main class="login-shell">
    <section class="login-card">
      <div class="brand"><img src="logo.jpg" alt="Logo" style="height: 60px; border-radius: 8px;"></div>
      <span class="eyebrow">خُطى | رفيقك نحو التفوق</span>
      <h1>مرحبًا بعودتك</h1>
      <p>سجّل الدخول للوصول إلى لوحة الدراسة الخاصة بك.</p>
      
      <form id="loginForm" autocomplete="on">
        <label>البريد الإلكتروني<input id="email" name="email" type="email" required placeholder="البريد الإلكتروني"></label>
        <label>كلمة السر<input id="password" name="password" type="password" required placeholder="كلمة السر"></label>
        <button type="submit">دخول</button>
        <button type="button" id="googleLogin" style="margin-top: 10px; background-color: #4285F4;">تسجيل الدخول بواسطة جوجل</button>
        <div id="loginError" class="error" hidden></div>
      </form>

      <div class="links">
        <a href="/register.html">إنشاء حساب جديد</a>
        <a href="/forgot-password.html">نسيت كلمة المرور؟</a>
      </div>
    </section>
  </main>
  <script type="module" src="login.js"></script>

  <footer style="text-align: center; padding: 20px; font-size: 0.9em; color: #666; margin-top: 40px; border-top: 1px solid #eee;">
    جميع الحقوق محفوظة معاذ الصبوح &copy; <script>document.write(new Date().getFullYear())</script><br>
    <div style="margin-top: 10px; display: flex; justify-content: center; gap: 15px;">
      <a href="https://github.com/MoazAlsabouh/" target="_blank" style="color: #4CAF50; text-decoration: none;">GitHub</a>
      <a href="https://www.linkedin.com/in/moazalsabouh/" target="_blank" style="color: #4CAF50; text-decoration: none;">LinkedIn</a>
      <a href="https://x.com/moazAlsabouh" target="_blank" style="color: #4CAF50; text-decoration: none;">X (Twitter)</a>
    </div>
  </footer>
\n</body>
</html>

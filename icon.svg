<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="4" />

  <g filter="url(#glow)">
    <!-- Ascending Steps / Khuta Pillars -->
    <!-- Step 1 (Left) -->
    <rect x="110" y="340" width="70" height="90" rx="16" fill="url(#stepGrad)" opacity="0.85" filter="url(#softShadow)" />
    <!-- Step 2 (Middle) -->
    <rect x="200" y="280" width="70" height="150" rx="16" fill="url(#stepGrad)" opacity="0.95" filter="url(#softShadow)" />
    <!-- Step 3 (Right) -->
    <rect x="290" y="220" width="70" height="210" rx="16" fill="#67e8f9" filter="url(#softShadow)" />

    <!-- Ascending Arrow Curve -->
    <path d="M 125 310 Q 240 230 365 175" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="8 12" />
    <polygon points="365,160 395,175 375,200" fill="url(#goldGrad)" />

    <!-- Graduation Cap (Mortarboard) -->
    <!-- Cap Diamond -->
    <polygon points="256,105 385,155 256,205 127,155" fill="url(#capGrad)" filter="url(#softShadow)" />
    <!-- Cap Lower Skullcap -->
    <path d="M 175 175 Q 256 225 337 175 L 337 205 Q 256 250 175 205 Z" fill="#c7d2fe" />
    
    <!-- Tassel -->
    <path d="M 256 155 Q 220 165 210 205 Q 205 235 210 260" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" />
    <!-- Tassel Brush -->
    <polygon points="204,258 216,258 213,285 207,285" fill="url(#goldGrad)" />
    <circle cx="210" cy="260" r="5" fill="#f59e0b" />
    <!-- Cap Center Button -->
    <circle cx="256" cy="155" r="8" fill="url(#goldGrad)" />
  </g>
</svg>

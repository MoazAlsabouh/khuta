<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التحقق من البريد | خُطى | رفيقك نحو التفوق</title>
  <link rel="stylesheet" href="login.css">
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <link rel="apple-touch-icon" href="logo.jpg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <style>
    .links { display: flex; justify-content: center; margin-top: 15px; font-size: 0.9em; }
    .links a { color: #4285F4; text-decoration: none; font-weight: bold; }
    .brand { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 20px; }
    .brand img { height: 60px; border-radius: 8px; mix-blend-mode: multiply; }
  </style>
  <script>
    (function() {
      const t = localStorage.getItem('khuta_theme');
      if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
  <main class="login-shell">
    <header class="auth-topbar">
      <a class="brand-link" href="login.html">
        <img src="logo.jpg" alt="Logo">
        <span><b>خُطى</b><small>رفيقك نحو التفوق</small></span>
      </a>
      <button id="themeToggle" class="theme-toggle-btn" title="تبديل المظهر">🌙</button>
    </header>

    <section class="login-card">
      <div class="brand">
        <img src="logo.jpg" alt="Logo">
        <span style="font-weight: bold; color: var(--text); font-size: 1.2em;">خُطى | رفيقك نحو التفوق</span>
      </div>
      <h1 style="text-align:center;">التحقق من البريد</h1>
      <p style="text-align:center; margin-bottom: 20px;">يرجى تأكيد بريدك الإلكتروني للمتابعة.</p>
      
      <form id="verifyForm" autocomplete="off">
        <label>رمز التحقق<input id="code" name="code" type="text" required placeholder="أدخل الرمز المكون من 6 أرقام" style="text-align:center; letter-spacing: 5px; font-size: 1.5em;"></label>
        <button type="submit" style="background: #4285F4;">تأكيد الرمز</button>
        <div id="verifyError" class="error" hidden style="margin-top: 10px;"></div>
      </form>

      <div class="links">
        <a href="login.html">العودة لتسجيل الدخول</a>
      </div>
    </section>

    <footer class="site-footer">
      <strong class="site-title">خُطى | رفيقك نحو التفوق</strong><br>
      <span class="site-copy">جميع الحقوق محفوظة المبرمج معاذ الصبوح &copy; <span id="yearSpan"></span></span><br>
      <div class="social-links">
        <a href="https://github.com/MoazAlsabouh/" target="_blank" title="GitHub">
          <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
        </a>
        <a href="https://linkedin.com/in/moazalsabouh/" target="_blank" title="LinkedIn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="#0077b5"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
        </a>
        <a href="https://x.com/moazAlsabouh" target="_blank" title="X">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="#1da1f2"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        </a>
      </div>
    </footer>
  </main>

  <script>
    const ys = document.getElementById('yearSpan');
    if (ys) ys.textContent = new Date().getFullYear();
    const btn = document.getElementById('themeToggle');
    if (btn) {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      btn.textContent = isDark ? '☀️' : '🌙';
      btn.onclick = () => {
        const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('khuta_theme', next);
        btn.textContent = next === 'dark' ? '☀️' : '🌙';
      };
    }
  </script>

  <script type="module">
    import { auth } from './firebase-init.js';
    import { applyActionCode } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    
    const params = new URLSearchParams(location.search);
    const code = params.get('oobCode');
    
    if (code) {
      document.getElementById('verifyForm').innerHTML = '<p style="text-align:center; color:var(--muted);">جاري التحقق من بريدك الإلكتروني...</p>';
      applyActionCode(auth, code).then(() => {
        document.getElementById('verifyForm').innerHTML = '<p style="color:#10b981; text-align:center; font-weight:bold;">تم التحقق من بريدك بنجاح! 🎉<br><br><a href="index.html" class="button" style="display:inline-block; padding:10px 20px; background:#4285F4; color:white; border-radius:8px; text-decoration:none;">الذهاب للرئيسية</a></p>';
      }).catch(err => {
        document.getElementById('verifyForm').innerHTML = '<p style="color:#ef4444; text-align:center;">فشل التحقق: ' + err.message + '</p>';
      });
    } else {
      document.getElementById('verifyForm').innerHTML = '<p style="color:#ef4444; text-align:center;">رابط غير صالح أو منتهي الصلاحية.</p>';
    }
  </script>
</body>
</html>

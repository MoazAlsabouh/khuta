<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التحقق من البريد • خريطة الدراسة</title><link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-card">
      <div class="brand">📧</div>
      <h1>التحقق من البريد</h1>
      <p>لقد أرسلنا رمز تحقق إلى بريدك الإلكتروني.</p>
      
      <form id="verifyForm" autocomplete="off">
        <label>رمز التحقق<input id="code" name="code" type="text" required placeholder="أدخل الرمز المكون من 6 أرقام" style="text-align:center; letter-spacing: 5px; font-size: 1.5em;"></label>
        <button type="submit">تأكيد الرمز</button>
        <div id="verifyError" class="error" hidden></div>
      </form>
    </section>
  </main>
  <script>
    const email = localStorage.getItem('verifyEmail');
    if (!email) location.href = '/register.html';

    document.getElementById('verifyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const error = document.getElementById('verifyError');
      const btn = form.querySelector('button');
      error.hidden = true; btn.disabled = true; btn.textContent = 'جاري التحقق...';
      try {
        const body = { email, code: form.code.value };
        const res = await fetch('/api/verify', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        localStorage.removeItem('verifyEmail');
        location.href = '/index.html';
      } catch (err) {
        error.textContent = err.message; error.hidden = false;
      } finally {
        btn.disabled = false; btn.textContent = 'تأكيد الرمز';
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إعادة تعيين كلمة المرور • خريطة الدراسة</title><link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-card">
      <div class="brand"><img src="logo.jpg" alt="Logo" style="height: 60px; border-radius: 8px;"></div>
      <h1>إعادة تعيين كلمة المرور</h1>
      <p>أدخل الرمز الذي وصلك وكلمة المرور الجديدة.</p>
      
      <form id="resetForm" autocomplete="off">
        <label>رمز التحقق<input id="code" name="code" type="text" required placeholder="أدخل الرمز" style="text-align:center; letter-spacing: 5px; font-size: 1.5em;"></label>
        <label>كلمة المرور الجديدة<input id="newPassword" name="newPassword" type="password" required placeholder="كلمة المرور الجديدة"></label>
        <button type="submit">إعادة تعيين</button>
        <div id="resetError" class="error" hidden></div>
      </form>
    </section>
  </main>
  <script>
    const email = localStorage.getItem('resetEmail');
    if (!email) location.href = '/forgot-password.html';

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const error = document.getElementById('resetError');
      const btn = form.querySelector('button');
      error.hidden = true; btn.disabled = true; btn.textContent = 'جاري التعيين...';
      try {
        const body = { email, code: form.code.value, newPassword: form.newPassword.value };
        const res = await fetch('/api/reset-password', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        localStorage.removeItem('resetEmail');
        location.href = '/login.html';
      } catch (err) {
        error.textContent = err.message; error.hidden = false;
      } finally {
        btn.disabled = false; btn.textContent = 'إعادة تعيين';
      }
    });
  </script>

  <footer style="text-align: center; padding: 20px; font-size: 0.9em; color: #666; margin-top: 40px; border-top: 1px solid #eee;">
    جميع الحقوق محفوظة معاذ الصبوح &copy; <script>document.write(new Date().getFullYear())</script><br>
    <div style="margin-top: 10px; display: flex; justify-content: center; gap: 15px;">
      <a href="https://github.com/MoazAlsabouh/" target="_blank" style="color: #4CAF50; text-decoration: none;">GitHub</a>
      <a href="https://www.linkedin.com/in/moazalsabouh/" target="_blank" style="color: #4CAF50; text-decoration: none;">LinkedIn</a>
      <a href="https://x.com/moazAlsabouh" target="_blank" style="color: #4CAF50; text-decoration: none;">X (Twitter)</a>
    </div>
  </footer>
\n</body>
</html>

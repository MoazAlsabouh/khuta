<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نسيت كلمة المرور • خريطة الدراسة</title><link rel="stylesheet" href="login.css">
  <style>
    .links { display: flex; justify-content: center; margin-top: 15px; font-size: 0.9em; }
    .links a { color: #4CAF50; text-decoration: none; }
  </style>
</head>
<body>
  <main class="login-shell">
    <section class="login-card">
      <div class="brand">🔒</div>
      <h1>نسيت كلمة المرور</h1>
      <p>أدخل بريدك الإلكتروني المسجل وسنرسل لك رمزاً لإعادة تعيين كلمة المرور.</p>
      
      <form id="forgotForm" autocomplete="off">
        <label>البريد الإلكتروني<input id="email" name="email" type="email" required placeholder="البريد الإلكتروني"></label>
        <button type="submit">إرسال الرمز</button>
        <div id="forgotError" class="error" hidden></div>
      </form>

      <div class="links">
        <a href="/login.html">العودة لتسجيل الدخول</a>
      </div>
    </section>
  </main>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const error = document.getElementById('forgotError');
      const btn = form.querySelector('button');
      error.hidden = true; btn.disabled = true; btn.textContent = 'جاري الإرسال...';
      try {
        const body = { email: form.email.value };
        const res = await fetch('/api/forgot-password', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        localStorage.setItem('resetEmail', body.email);
        location.href = '/reset-password.html';
      } catch (err) {
        error.textContent = err.message; error.hidden = false;
      } finally {
        btn.disabled = false; btn.textContent = 'إرسال الرمز';
      }
    });
  </script>
</body>
</html>
